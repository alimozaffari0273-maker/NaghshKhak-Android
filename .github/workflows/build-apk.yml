name: Build NaghshKhak APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -o NaghshKhak_Android_Project.zip -d project

      - name: Build debug APK
        run: gradle -p project assembleDebug

      - name: Inspect APK
        shell: bash
        run: |
          APK="project/app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK file..."
          test -f "$APK"
          ls -lh "$APK"
          file "$APK"

          echo "Checking APK ZIP structure..."
          unzip -t "$APK"

          echo "APK contents:"
          unzip -l "$APK"

          echo "Checking required files..."
          unzip -Z1 "$APK" > apk-files.txt

          grep -qx "classes.dex" apk-files.txt
          grep -qx "AndroidManifest.xml" apk-files.txt
          grep -qx "resources.arsc" apk-files.txt

          echo "Checking APK signature..."
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

          echo "APK inspection completed successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NaghshKhak-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
